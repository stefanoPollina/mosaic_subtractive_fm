<!DOCTYPE html>
<html lang="en" style="background-color:#07080c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuum Mosaic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%2310141c' width='16' height='16'/%3E%3Cpath d='M1 8h2l2-4 2 8 2-4h2' fill='none' stroke='%23e2a84a' stroke-width='1.2'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #07080c;
  --chassis: #141820;
  --panel: #181c26;
  --line: #2c3344;
  --line-2: #3c4558;
  --text: #e6ebf4;
  --dim: #8d95a8;
  --amber: #e2a84a;
  --cyan: #6ee0d2;
  --blue: #8eb7ff;
  --danger: #e07a7a;
  --font: "Segoe UI", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, "Cascadia Mono", monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; background-color: #07080c; }
body {
  margin: 0;
  background-color: #07080c;
  background-image: radial-gradient(ellipse at 50% 0%, #243044 0%, transparent 46%);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, .knob:focus-visible, select:focus-visible {
  outline: 1px solid var(--accent, var(--amber));
  outline-offset: 2px;
}

#stage {
  height: 100%;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.plugin {
  --accent: var(--amber);
  --accent-ink: #2a1c08;
  width: 1280px;
  height: 820px;
  flex: none;
  transform-origin: center center;
  display: grid;
  grid-template-rows: 58px 34px minmax(0, 1fr) 172px;
  border-radius: 16px;
  background-color: #141820;
  background-image: linear-gradient(180deg, #1d222d 0%, #141820 28%, #10141b 100%);
  box-shadow:
    0 0 0 1px #050608,
    0 0 0 2px #343c4e,
    0 28px 70px rgba(0, 0, 0, .55),
    inset 0 1px 0 rgba(255, 255, 255, .07);
  position: relative;
  user-select: none;
  overflow: hidden;
}
.plugin.layer-b { --accent: var(--blue); --accent-ink: #0d1830; }

header.top {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 8px 12px 6px;
  border-bottom: 1px solid #000;
  background: linear-gradient(180deg, #222836, #171c26);
}
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand strong, .brand em {
  display: block;
  font-style: normal;
  letter-spacing: .2em;
  line-height: 1.05;
}
.brand strong { font-size: 13px; font-weight: 650; }
.brand em { font-size: 11px; letter-spacing: .34em; color: var(--accent); margin-top: 3px; }
.brand small { display: block; margin-top: 3px; color: var(--dim); letter-spacing: .12em; font-size: 8px; }

.presets { display: flex; align-items: center; gap: 6px; min-width: 0; position: relative; }
.presets .nav, .presets .texty {
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--line-2);
  background: #121722;
  color: var(--text);
}
.presets .nav { width: 32px; }
.preset-name {
  flex: 1;
  min-width: 0;
  height: 32px;
  text-align: left;
  padding: 0 12px;
  border-radius: 6px;
  border: 1px solid var(--line-2);
  background: #0e131c;
  color: var(--text);
  font-size: 13px;
  letter-spacing: .04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.presets .texty { padding: 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.menu {
  position: absolute;
  z-index: 4;
  top: 38px;
  left: 38px;
  right: 118px;
  max-height: 320px;
  overflow: auto;
  background: #121722;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, .45);
  padding: 6px;
}
.menu[hidden] { display: none; }
.menu button {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: var(--text);
  padding: 7px 8px;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}
.menu button.on, .menu button:hover { background: #243044; }
.menu .tag { color: var(--dim); font-size: 9px; letter-spacing: .12em; }
.menu .kill { color: var(--danger); border: 0; background: transparent; padding: 0 4px; }
.menu .group {
  margin: 8px 6px 4px;
  color: var(--dim);
  font-size: 9px;
  letter-spacing: .16em;
}

.meters { display: flex; align-items: center; gap: 10px; }
.scope {
  width: 148px;
  height: 36px;
  background: #0b0e14;
  border-radius: 6px;
  border: 1px solid #293140;
  display: block;
}
.master-knob { width: auto; }
.master-knob .knob {
  width: auto;
  flex-direction: row;
  align-items: center;
  gap: 4px;
}
.master-knob .knob svg { width: 36px; height: 36px; }
.voicebox, .cpubox { min-width: 64px; }
.voicebox b, .cpubox b {
  display: block;
  font-size: 8px;
  letter-spacing: .14em;
  color: var(--dim);
  font-weight: 600;
}
.voicebox span { font-family: var(--mono); font-size: 16px; color: var(--cyan); }
.meter {
  margin-top: 4px;
  height: 6px;
  border-radius: 99px;
  background: #0c1016;
  overflow: hidden;
  border: 1px solid #2a3344;
}
.meter i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--amber));
}
.midi-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3a4254;
  box-shadow: inset 0 0 0 1px #000;
}
.midi-dot.live { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.status { font-size: 9px; color: var(--dim); max-width: 90px; line-height: 1.2; }

.tabs {
  display: flex;
  align-items: end;
  gap: 2px;
  padding: 0 10px;
  border-bottom: 1px solid #000;
  background: #12161e;
}
.tabs button {
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--dim);
  letter-spacing: .16em;
  font-size: 11px;
  font-weight: 700;
  padding: 8px 14px 6px;
}
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabs .spacer { flex: 1; }
.chip {
  align-self: center;
  font-size: 10px;
  letter-spacing: .14em;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 99px;
  padding: 3px 8px;
  margin-right: 8px;
}
.layer-edit { display: flex; gap: 4px; padding-right: 8px; }
.layer-edit button {
  border: 1px solid var(--line-2);
  background: #171c26;
  border-radius: 5px;
  padding: 4px 8px;
  letter-spacing: .12em;
  font-size: 10px;
  margin-bottom: 4px;
}
.layer-edit button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.pages { min-height: 0; overflow: hidden; }
.page { display: none; height: 100%; min-height: 0; }
.page.on { display: grid; }
.page-play {
  grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr) 78px;
  gap: 8px;
  padding: 8px;
}
.row { display: grid; gap: 8px; min-height: 0; }
.osc-row { grid-template-columns: 1fr 1fr 1fr 1.28fr; }
.env-row { grid-template-columns: 1.15fr 1.15fr .82fr .82fr 1.05fr; }

.panel {
  min-width: 0;
  min-height: 0;
  background: linear-gradient(180deg, #1c212c, #151922);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
  display: flex;
  flex-direction: column;
}
.panel h3 {
  margin: 0;
  padding: 7px 10px 0;
  font-size: 10px;
  letter-spacing: .16em;
  font-weight: 700;
  color: var(--accent);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel h3 span { color: var(--dim); font-weight: 500; letter-spacing: .08em; }
canvas.display {
  width: calc(100% - 16px);
  margin: 6px 8px 2px;
  height: 74px;
  background: #0b0e14;
  border-radius: 6px;
  border: 1px solid #262d3c;
  display: block;
}
.env-panel canvas.display, .lfo-panel canvas.display { height: 58px; }
.segs {
  display: flex;
  gap: 3px;
  padding: 4px 8px 0;
}
.segs button {
  flex: 1;
  min-width: 0;
  border: 1px solid #343c4e;
  background: #121722;
  color: var(--dim);
  border-radius: 4px;
  font-size: 9px;
  letter-spacing: .08em;
  padding: 4px 0;
}
.segs button.on {
  color: var(--accent-ink);
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 700;
}
.knobs {
  display: flex;
  justify-content: space-between;
  gap: 2px;
  padding: 2px 6px 6px;
  margin-top: auto;
}
.knob {
  width: 54px;
  display: flex;
  flex-direction: column;
  align-items: center;
  touch-action: none;
  cursor: ns-resize;
}
.knob svg { width: 42px; height: 42px; display: block; }
.knob .track, .knob .arc { fill: none; stroke-width: 2.6; }
.knob .track { stroke: #2a3142; }
.knob .arc { stroke: var(--accent); stroke-linecap: round; }
.knob .cap { fill: #242a36; stroke: #3a4254; stroke-width: 1; }
.knob .needle { stroke: #f4f7fb; stroke-width: 1.6; stroke-linecap: round; }
.kv {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent);
  min-height: 12px;
  line-height: 1.1;
}
.kl {
  font-size: 8px;
  letter-spacing: .12em;
  color: var(--dim);
  text-align: center;
}

.voice {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #141820;
  min-width: 0;
}
.voice .group {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-right: 8px;
  border-right: 1px solid #2a3142;
}
.voice .group:last-child { border-right: 0; }
.switch {
  border: 1px solid #3a4254;
  background: #121722;
  color: var(--dim);
  border-radius: 99px;
  min-width: 34px;
  height: 26px;
  padding: 0 8px;
  letter-spacing: .08em;
  font-size: 10px;
  font-weight: 700;
}
.switch.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.page-mod, .page-fx, .page-seq { padding: 8px; align-content: stretch; }
.page-mod { grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
.mod-head { display: flex; gap: 8px; }
.mod-head .panel { flex: 1; }
.matrix {
  min-height: 0;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #141820;
}
.matrix header, .mod-row {
  display: grid;
  grid-template-columns: 28px 1.2fr 16px 1.2fr 112px 88px;
  gap: 8px;
  align-items: center;
  padding: 6px 10px;
}
.matrix header {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #141820;
  color: var(--dim);
  font-size: 9px;
  letter-spacing: .14em;
  border-bottom: 1px solid var(--line);
}
.mod-row { border-bottom: 1px solid #222836; }
.mod-row .knob {
  width: auto;
  flex-direction: row;
  align-items: center;
  gap: 3px;
}
.mod-row .knob svg { width: 28px; height: 28px; }
.mod-row .arrow { color: var(--accent); text-align: center; }
.note {
  color: var(--dim);
  font-size: 11px;
  line-height: 1.45;
  padding: 8px 10px 10px;
}

.page-fx {
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: 1fr 1fr;
  gap: 8px;
}
.fx-card .knobs { margin-top: 8px; }
.fx-card p { margin: 4px 10px 0; color: var(--dim); font-size: 10px; line-height: 1.35; }
.fx-top { display: flex; justify-content: space-between; align-items: center; padding-right: 8px; }

.page-seq { grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
.transport {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #141820;
}
.play {
  width: 64px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  letter-spacing: .12em;
  font-weight: 800;
}
.play.on { background: var(--accent); color: var(--accent-ink); }
select.slim {
  background: #10141c;
  border: 1px solid #3a4254;
  border-radius: 5px;
  padding: 5px 6px;
  font-size: 11px;
}
.steps {
  display: grid;
  grid-template-columns: repeat(16, minmax(0, 1fr));
  gap: 4px;
  min-height: 0;
}
.step { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lane {
  position: relative;
  flex: 1;
  min-height: 180px;
  background: linear-gradient(#10141c, #0c1016);
  border: 1px solid #2a3142;
  border-radius: 5px;
  touch-action: none;
  cursor: ns-resize;
}
.bar {
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 3px;
  border-radius: 3px;
  background: linear-gradient(var(--accent), #6d5424);
  pointer-events: none;
  min-height: 2px;
}
.plugin.layer-b .bar { background: linear-gradient(var(--blue), #2a3d66); }
.step .nm {
  position: absolute;
  left: 0;
  right: 0;
  top: 4px;
  text-align: center;
  font-size: 9px;
  font-style: normal;
  letter-spacing: .04em;
  color: #d5dbe6;
  pointer-events: none;
}
.step.off .bar { opacity: .28; }
.step.now .lane { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
.step.dim { opacity: .38; }
.mini {
  border: 1px solid #343c4e;
  background: #121722;
  color: var(--dim);
  border-radius: 3px;
  font-size: 8px;
  letter-spacing: .06em;
  padding: 3px 0;
}
.mini.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 700; }
.gate-row { display: flex; align-items: center; gap: 6px; }
.gate-row .slots { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; flex: 1; }
.gate-row .slots button { height: 22px; }

footer.bed {
  display: grid;
  grid-template-rows: minmax(0, 1fr) 18px;
  border-top: 1px solid #000;
  background: linear-gradient(#12161e, #0c0f14);
  min-height: 0;
}
.bed-main {
  display: grid;
  grid-template-columns: 46px 34px 34px minmax(0, 1fr);
  gap: 8px;
  padding: 8px 10px 2px;
  min-height: 0;
}
.oct { display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
.oct button {
  width: 100%;
  height: 26px;
  border-radius: 5px;
  border: 1px solid #3a4254;
  background: #171c26;
}
.oct b { font-size: 11px; letter-spacing: .08em; color: var(--accent); }
.wheel {
  position: relative;
  border-radius: 7px;
  border: 1px solid #2c3344;
  background: linear-gradient(#1a1f2a, #0c0f14);
  touch-action: none;
  overflow: hidden;
}
.wheel-cap {
  position: absolute;
  left: 4px;
  right: 4px;
  height: 18%;
  border-radius: 4px;
  background: linear-gradient(#d7dde8, #8b93a3);
  box-shadow: 0 2px 0 #000;
}
.wheel.mod .wheel-cap { background: linear-gradient(var(--cyan), #1e6d66); }
.wheel span {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 4px;
  text-align: center;
  font-size: 7px;
  letter-spacing: .12em;
  color: var(--dim);
}
.keys { position: relative; height: 100%; touch-action: none; }
.white, .black {
  position: absolute;
  top: 0;
  border: 0;
  padding: 0;
}
.white {
  height: 100%;
  border-radius: 0 0 5px 5px;
  background: linear-gradient(#f6f3ec, #d9d3c8);
  border: 1px solid #2a241c;
  color: #5c564c;
  z-index: 1;
  font-size: 9px;
}
.white.on { background: linear-gradient(#c8f6f0, #7dcec6); color: #10302c; }
.black {
  height: 62%;
  border-radius: 0 0 3px 3px;
  background: linear-gradient(#3a4150, #0d1016);
  border: 1px solid #07090d;
  z-index: 2;
}
.black.on { background: linear-gradient(#1c7a72, #0c2c2a); }
.key-label {
  position: absolute;
  bottom: 6px;
  left: 0;
  right: 0;
  text-align: center;
  pointer-events: none;
}
.hint {
  text-align: center;
  color: #6d7588;
  font-size: 10px;
  letter-spacing: .04em;
}

.overlay, .modal {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  background: rgba(5, 7, 10, .62);
}
.overlay[hidden], .modal[hidden] { display: none; }
.overlay-card, .dialog {
  width: min(420px, 80%);
  text-align: center;
  background: #171c26;
  border: 1px solid #3a4254;
  border-radius: 14px;
  padding: 22px 20px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
}
.overlay-card strong { letter-spacing: .22em; font-size: 18px; }
.overlay-card em { display: block; margin-top: 4px; font-style: normal; letter-spacing: .28em; color: var(--accent); }
.overlay-card p { color: var(--dim); font-size: 13px; }
.overlay-card button, .dialog button {
  margin-top: 8px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  padding: 8px 16px;
  letter-spacing: .14em;
  font-size: 12px;
}
.dialog { text-align: left; }
.dialog h3 { margin: 0 0 8px; letter-spacing: .12em; font-size: 13px; }
.dialog input {
  width: 100%;
  background: #0e131c;
  border: 1px solid #3a4254;
  border-radius: 6px;
  padding: 8px 10px;
}
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.boot-error { color: var(--danger); font-size: 12px; min-height: 1em; }

</style>
</head>
<body bgcolor="#07080c" style="margin:0;background-color:#07080c;color:#e6ebf4;min-height:100vh">
<p id="bootNote" style="margin:0;background-color:#e2a84a;color:#1a1408;font:16px/1.4 system-ui,sans-serif;padding:16px 20px">Loading Continuum Mosaic…</p>
<div id="stage"></div>
<script>
window.onerror = function (message) {
  var note = document.getElementById('bootNote');
  if (!note) return;
  note.style.display = 'block';
  note.textContent = message || 'The synth script failed to start.';
};

<script>

    pdCurve: 'bend',

const STORAGE = 'continuum-mosaic-presets-v1';
const LAST = 'continuum-mosaic-last-preset';
const LAST_STATE = 'continuum-mosaic-last-state-v2';

function loadUserPresets() {
  try {
    const raw = localStorage.getItem(STORAGE);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    return [];
  }
}

function saveUserPresets(list) {
  localStorage.setItem(STORAGE, JSON.stringify(list));
}

function loadLastId() {
  try {
    return localStorage.getItem(LAST) || 'factory:Init';
  } catch (err) {
    return 'factory:Init';
  }
}

function saveLastId(id) {
  try {
    localStorage.setItem(LAST, id);
  } catch (err) {
    /* private mode */
  }
}

function loadLastState() {
  try {
    const raw = localStorage.getItem(LAST_STATE);
    if (!raw) return null;
    return normalize(JSON.parse(raw));
  } catch (err) {
    return null;
  }
}

function saveLastState(value) {
  try {
    localStorage.setItem(LAST_STATE, JSON.stringify(value));
  } catch (err) {
    /* private mode */
  }
}

function fill(base, extra) {
  if (!extra || typeof extra !== 'object') return base;
  for (const key of Object.keys(base)) {
    const value = extra[key];
    if (value == null) continue;
    if (Array.isArray(base[key]) && Array.isArray(value)) base[key] = value;
    else if (base[key] && typeof base[key] === 'object' && !Array.isArray(base[key]) && typeof value === 'object') fill(base[key], value);
    else base[key] = value;
  }
  return base;
}

function repair(state) {
  const base = defaultState();
  state.lfo = [0, 1].map((i) => ({ ...base.lfo[i], ...(state.lfo && state.lfo[i] || {}) }));
  state.mod = Array.from({ length: 8 }, (_, i) => ({ ...base.mod[i], ...(state.mod && state.mod[i] || {}) }));
  ['A', 'B'].forEach((id) => {
    const layer = state.layers[id] || {};
    const fallback = base.layers[id];
    const oscs = layer.osc || [];
    state.layers[id] = {
      ...fallback,
      ...layer,
      osc: [0, 1, 2].map((i) => ({ ...fallback.osc[i], ...(oscs[i] || {}) })),
      filter: { ...fallback.filter, ...(layer.filter || {}) },
      amp: { ...fallback.amp, ...(layer.amp || {}) },
      filt: { ...fallback.filt, ...(layer.filt || {}) }
    };
  });
  const stepsIn = state.seq.steps || [];
  const gatesIn = state.seq.gates || [];
  state.seq.steps = Array.from({ length: 16 }, (_, i) => ({ ...base.seq.steps[i], ...(stepsIn[i] || {}) }));
  state.seq.gates = Array.from({ length: 16 }, (_, i) => gatesIn[i] !== false);
  state.seq.length = state.seq.length === 8 ? 8 : 16;
  return state;
}

function normalize(partial) {
  const next = repair(fill(defaultState(), partial || {}));
  if (partial && partial.name) next.name = partial.name;
  return next;
}

function recall(id, userPresets) {
  if (id.startsWith('factory:')) {
    const name = id.slice(8);
    const found = FACTORY.find((preset) => preset.name === name) || FACTORY[0];
    return normalize(clone(found));
  }
  const found = userPresets.find((preset) => preset.id === id);
  if (!found) return normalize(clone(FACTORY[0]));
  const next = normalize(clone(found.state));
  next.name = found.name || next.name;
  return next;
}

/** Web Audio graph: worklet voices, effects, meters, MIDI-facing note API. */

const SYNC = { '1/4': 1, '1/8': 0.5, '1/8d': 0.75, '1/16': 0.25 };

function curve(amount) {
  const n = 256;
  const data = new Float32Array(n);
  const k = 1 + Math.max(0, amount) * 22;
  const norm = Math.tanh(k);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    data[i] = Math.tanh(k * x) / norm;
  }
  return data;
}

function impulse(ctx, seconds) {
  const length = Math.max(1, Math.floor(ctx.sampleRate * seconds));
  const buffer = ctx.createBuffer(2, length, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buffer.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      const t = i / length;
      const env = Math.pow(1 - t, 1.6) * Math.exp(-2.4 * t);
      const early = i < ctx.sampleRate * 0.03 ? 0.4 : 1;
      data[i] = (Math.random() * 2 - 1) * env * early * 0.55;
    }
  }
  return buffer;
}

class Engine {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.starting = null;
    this.state = null;
    this.onMeter = null;
    this.midiInputs = [];
    this.onMidi = null;
    this.reverbSeconds = 0;
    this.driveAmount = -1;
  }

  ensure(state) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return Promise.reject(new Error('This browser has no Web Audio.'));
    if (!this.ctx) this.ctx = new AC();
    const ctx = this.ctx;
    if (ctx.state === 'suspended' || ctx.state === 'interrupted') ctx.resume();
    this.unlock();
    if (!this.gate) this.buildFx();
    if (this.ready) return Promise.resolve();
    if (!this.starting) this.starting = this.boot(state);
    return this.starting;
  }

  unlock() {
    if (this.unlocked || !this.ctx) return;
    this.unlocked = true;
    const ctx = this.ctx;
    const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    try { src.start(0); } catch (err) { /* already started */ }
  }

  async boot(state) {
    const ctx = this.ctx;
    this.installProcessor();
    this.ready = true;
    if (state) this.setState(state);
    const layer = state && state.layers && state.layers.A && state.layers.A.enabled === false ? 'B' : 'A';
    this.noteOn('boot', 60, 118, { layer });
    if (this.pullAudio) this.pullAudio();
    this.pullTimer = setInterval(this.pullAudio, 20);
    setTimeout(() => this.noteOff('boot'), 520);
    if (ctx.state !== 'running') await ctx.resume();
  }

  installProcessor() {
    const Processor = globalThis.MosaicProcessor;
    if (!Processor) throw new Error('The synth voice did not load.');
    const proc = new Processor();
    const ctx = this.ctx;
    const block = 512;
    let next = 0;
    proc.port.postMessage = (msg) => {
      if (msg && msg.type === 'meter' && this.onMeter) this.onMeter(msg);
    };
    const pull = () => {
      const horizon = ctx.currentTime + 0.1;
      if (!next || next < ctx.currentTime) next = ctx.currentTime + 0.02;
      let guard = 0;
      while (next < horizon && guard++ < 8) {
        const buffer = ctx.createBuffer(2, block, ctx.sampleRate);
        const left = buffer.getChannelData(0);
        const right = buffer.getChannelData(1);
        proc.sr = ctx.sampleRate;
        proc.now = next;
        proc.process([], [[left, right]]);
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(this.gate);
        src.onended = () => { try { src.disconnect(); } catch (err) { /* already gone */ } };
        src.start(next);
        next += block / ctx.sampleRate;
      }
    };
    this.pullAudio = pull;
    this.node = {
      port: {
        postMessage(msg) {
          if (proc.port.onmessage) proc.port.onmessage({ data: msg });
        }
      },
      connect() {}
    };
  }

  buildFx() {
    const ctx = this.ctx;
    this.gate = ctx.createGain();
    this.drive = ctx.createWaveShaper();
    this.drive.oversample = '2x';
    this.drive.curve = curve(0);
    this.driveDry = ctx.createGain();
    this.driveWet = ctx.createGain();
    this.driveSum = ctx.createGain();
    this.gate.connect(this.driveDry);
    this.gate.connect(this.drive);
    this.drive.connect(this.driveWet);
    this.driveDry.connect(this.driveSum);
    this.driveWet.connect(this.driveSum);

    this.phaserDry = ctx.createGain();
    this.phaserWet = ctx.createGain();
    this.phaserSum = ctx.createGain();
    this.phaseStages = [];
    let previous = this.driveSum;
    this.driveSum.connect(this.phaserDry);
    for (let i = 0; i < 4; i++) {
      const stage = ctx.createBiquadFilter();
      stage.type = 'allpass';
      stage.frequency.value = 1600;
      stage.Q.value = 0.7;
      previous.connect(stage);
      previous = stage;
      this.phaseStages.push(stage);
    }
    previous.connect(this.phaserWet);
    this.phaserDry.connect(this.phaserSum);
    this.phaserWet.connect(this.phaserSum);
    this.phaseLfo = ctx.createOscillator();
    this.phaseLfo.frequency.value = 0.2;
    this.phaseDepth = ctx.createGain();
    this.phaseDepth.gain.value = 400;
    this.phaseLfo.connect(this.phaseDepth);
    this.phaseStages.forEach((stage, i) => {
      const gain = ctx.createGain();
      gain.gain.value = 1 - i * 0.12;
      this.phaseDepth.connect(gain);
      gain.connect(stage.frequency);
    });
    this.phaseLfo.start();

    this.delay = ctx.createDelay(2);
    this.delayFb = ctx.createGain();
    this.delayDamp = ctx.createBiquadFilter();
    this.delayDamp.type = 'lowpass';
    this.delayDamp.frequency.value = 4200;
    this.delayWet = ctx.createGain();
    this.delayDry = ctx.createGain();
    this.fxSum = ctx.createGain();
    this.phaserSum.connect(this.delayDry);
    this.phaserSum.connect(this.delay);
    this.delay.connect(this.delayDamp);
    this.delayDamp.connect(this.delayFb);
    this.delayFb.connect(this.delay);
    this.delayDamp.connect(this.delayWet);
    this.delayDry.connect(this.fxSum);
    this.delayWet.connect(this.fxSum);

    this.multiWet = ctx.createGain();
    this.multi = [];
    for (const [type, hz, scale] of [['lowpass', 380, 1.35], ['bandpass', 1400, 1], ['highpass', 3200, 0.72]]) {
      const filter = ctx.createBiquadFilter();
      filter.type = type;
      filter.frequency.value = hz;
      if (type === 'bandpass') filter.Q.value = 0.7;
      const delay = ctx.createDelay(2.5);
      const fb = ctx.createGain();
      const level = ctx.createGain();
      level.gain.value = 0.34;
      this.phaserSum.connect(filter);
      filter.connect(delay);
      delay.connect(level);
      level.connect(this.multiWet);
      delay.connect(fb);
      fb.connect(delay);
      this.multi.push({ delay, fb, scale });
    }
    this.multiWet.connect(this.fxSum);

    this.reverb = ctx.createConvolver();
    this.reverbWet = ctx.createGain();
    this.fxSum.connect(this.reverb);
    this.reverb.connect(this.reverbWet);
    this.reverbWet.connect(this.fxSum);

    this.shimmer = ctx.createGain();
    this.shimmerFilter = ctx.createBiquadFilter();
    this.shimmerFilter.type = 'lowpass';
    this.shimmerFilter.frequency.value = 2200;
    this.shimmerOsc = [];
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i === 0 ? 'sine' : 'triangle';
      gain.gain.value = 0;
      osc.connect(gain);
      gain.connect(this.shimmerFilter);
      osc.start();
      this.shimmerOsc.push({ osc, gain });
    }
    this.shimmerFilter.connect(this.shimmer);
    this.shimmer.connect(this.fxSum);
    this.shimmerLfo = ctx.createOscillator();
    this.shimmerLfo.frequency.value = 0.12;
    this.shimmerDepth = ctx.createGain();
    this.shimmerLfo.connect(this.shimmerDepth);
    this.shimmerDepth.connect(this.shimmer.gain);
    this.shimmerLfo.start();

    this.comp = ctx.createDynamicsCompressor();
    this.limiter = ctx.createDynamicsCompressor();
    this.limiter.threshold.value = -1.5;
    this.limiter.knee.value = 0;
    this.limiter.ratio.value = 12;
    this.limiter.attack.value = 0.003;
    this.limiter.release.value = 0.12;
    this.master = ctx.createGain();
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 1024;
    this.analyser.smoothingTimeConstant = 0.72;
    this.fxSum.connect(this.comp);
    this.comp.connect(this.limiter);
    this.limiter.connect(this.master);
    this.master.connect(this.analyser);
    this.analyser.connect(ctx.destination);
  }

  setState(state) {
    if (!state) return;
    this.state = state;
    if (!this.ready || !this.node) return;
    this.node.port.postMessage({ type: 'state', state });
    this.applyFx();
  }

  applyFx() {
    const ctx = this.ctx;
    const fx = this.state.fx;
    const now = ctx.currentTime;
    const set = (param, value) => param.setTargetAtTime(value, now, 0.03);
    const drive = Math.max(0, Math.min(1, fx.drive || 0));
    if (Math.abs(drive - this.driveAmount) > 0.02) {
      this.drive.curve = curve(drive);
      this.driveAmount = drive;
    }
    set(this.driveWet.gain, drive > 0.001 ? 1 : 0);
    set(this.driveDry.gain, drive > 0.001 ? 1 - drive * 0.85 : 1);

    const phaser = fx.phaserOn ? fx.phaserWet : 0;
    set(this.phaserWet.gain, phaser);
    set(this.phaserDry.gain, 1 - phaser * 0.35);
    set(this.phaseLfo.frequency, 0.05 + (fx.phaserRate || 0) * 4);
    set(this.phaseDepth.gain, 120 + (fx.phaserDepth || 0) * 900);

    const bpm = this.state.seq && this.state.seq.bpm ? this.state.seq.bpm : 120;
    let delayTime = fx.delayTime || 0.3;
    if (fx.delaySync && fx.delaySync !== 'free' && SYNC[fx.delaySync]) {
      delayTime = (60 / bpm) * SYNC[fx.delaySync];
    }
    set(this.delay.delayTime, Math.min(1.8, Math.max(0.01, delayTime)));
    set(this.delayFb.gain, Math.min(0.85, Math.max(0, fx.delayFb || 0)));
    set(this.delayWet.gain, Math.max(0, fx.delayWet || 0));
    set(this.delayDry.gain, 1);

    const multi = fx.multiOn ? fx.multiWet : 0;
    set(this.multiWet.gain, Math.max(0, multi || 0));
    this.multi.forEach((band) => {
      set(band.delay.delayTime, Math.min(2.2, Math.max(0.02, (fx.multiTime || 0.3) * band.scale)));
      set(band.fb.gain, Math.min(0.8, Math.max(0, fx.multiFb || 0)));
    });

    set(this.reverbWet.gain, Math.max(0, fx.reverbWet || 0));
    const decay = Math.min(6, Math.max(0.4, fx.reverbDecay || 2));
    if (Math.abs(decay - this.reverbSeconds) > 0.25) {
      this.reverb.buffer = impulse(ctx, decay);
      this.reverbSeconds = decay;
    }

    const air = fx.shimmerOn ? fx.shimmerLevel : 0;
    const pitch = fx.shimmerPitch || 196;
    this.shimmerOsc.forEach((entry, i) => {
      set(entry.osc.frequency, pitch * [1, 1.5, 2.01][i]);
      set(entry.gain.gain, (air || 0) * [0.08, 0.035, 0.02][i]);
    });
    set(this.shimmerLfo.frequency, 0.05 + (fx.shimmerMotion || 0) * 0.7);
    set(this.shimmerDepth.gain, fx.shimmerOn ? (air || 0) * 0.15 : 0);

    if (fx.compOn) {
      set(this.comp.threshold, fx.compThreshold);
      set(this.comp.ratio, Math.max(1, fx.compRatio));
      set(this.comp.attack, Math.max(0.001, fx.compAttack));
      set(this.comp.release, Math.max(0.02, fx.compRelease));
    } else {
      set(this.comp.threshold, 0);
      set(this.comp.ratio, 1);
      set(this.comp.attack, 0.01);
      set(this.comp.release, 0.1);
    }
    set(this.master.gain, Math.max(0, this.state.master));
  }

  noteOn(id, note, vel = 100, opts = {}) {
    if (!this.node) return;
    this.node.port.postMessage({
      type: 'on',
      id,
      note,
      vel,
      layer: opts.layer || 'A',
      glide: opts.glide || 0,
      legato: !!opts.legato,
      time: opts.time || this.ctx.currentTime
    });
  }

  noteOff(id, time) {
    if (!this.node) return;
    this.node.port.postMessage({ type: 'off', id, time: time || this.ctx.currentTime });
  }

  bend(value) {
    if (!this.node) return;
    this.node.port.postMessage({ type: 'bend', value, time: this.ctx.currentTime });
  }

  mod(value) {
    if (!this.node) return;
    this.node.port.postMessage({ type: 'mod', value, time: this.ctx.currentTime });
  }

  sustain(on) {
    if (!this.node) return;
    this.node.port.postMessage({ type: 'sustain', on: !!on, time: this.ctx.currentTime });
  }

  panic() {
    if (!this.node) return;
    this.node.port.postMessage({ type: 'panic' });
    if (this.gate) this.gate.gain.setTargetAtTime(1, this.ctx.currentTime, 0.01);
  }

  setGate(value, time) {
    if (!this.gate) return;
    const t = time || this.ctx.currentTime;
    this.gate.gain.setTargetAtTime(Math.max(0, Math.min(1, value)), t, 0.004);
  }
}

function bindMidi(handlers) {
  if (!navigator.requestMIDIAccess) {
    handlers.status('No MIDI');
    return;
  }
  navigator.requestMIDIAccess({ sysex: false }).then((access) => {
    const attach = () => {
      const inputs = [...access.inputs.values()];
      inputs.forEach((input) => {
        input.onmidimessage = (event) => handlers.message(event.data);
      });
      handlers.status(inputs.length ? inputs.map((input) => input.name).join(', ') : 'No MIDI');
    };
    attach();
    access.onstatechange = attach;
  }).catch(() => handlers.status('MIDI blocked'));
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;

function noteName(midi) {
  const n = ((midi % 12) + 12) % 12;
  return NAMES[n] + (Math.floor(midi / 12) - 1);

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

  function buildSeq() {
    const pageNode = el('div', 'page page-seq');

      state.seq.steps.forEach((step) => { step.on = false; });

    });

    addSelect(transport, { path: 'seq.length', options: [['8', '8 steps'], ['16', '16 steps']], numeric: true });

  function stepColumn(index) {
    const col = el('div', 'step');
    const lane = el('div', 'lane');
    const bar = el('i', 'bar');
    const name = el('em', 'nm', 'C4');
    lane.append(bar, name);
    const drag = (event) => {
      const rect = lane.getBoundingClientRect();
      const ratio = 1 - clamp((event.clientY - rect.top) / rect.height, 0, 1);
      state.seq.steps[index].note = clamp(Math.round(36 + ratio * 48), 36, 84);
      state.seq.steps[index].on = true;
      schedule();
      syncStep(index);
    };
    lane.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      lane.setPointerCapture(event.pointerId);
      drag(event);
    });
    lane.addEventListener('pointermove', (event) => {
      if (lane.hasPointerCapture(event.pointerId)) drag(event);
    });
    const gate = el('button', 'mini gate', String(index + 1));
    gate.type = 'button';
    gate.addEventListener('click', () => {
      state.seq.steps[index].on = !state.seq.steps[index].on;
      schedule();
      syncStep(index);
    });
    const accent = el('button', 'mini', 'ACC');
    accent.type = 'button';
    accent.addEventListener('click', () => {
      state.seq.steps[index].accent = !state.seq.steps[index].accent;
      schedule();
      syncStep(index);
    });
    const slide = el('button', 'mini', 'SLD');
    slide.type = 'button';
    slide.addEventListener('click', () => {
      state.seq.steps[index].slide = !state.seq.steps[index].slide;
      schedule();
      syncStep(index);
    });
    col.append(lane, gate, accent, slide);
    return col;
  }

  function syncStep(index) {
    const col = stepGrid.children[index];
    const step = state.seq.steps[index];
    const ratio = clamp((step.note - 36) / 48, 0, 1);
    col.querySelector('.bar').style.height = Math.max(4, ratio * 100) + '%';
    col.querySelector('.nm').textContent = noteName(step.note);
    col.classList.toggle('off', !step.on);
    col.classList.toggle('dim', index >= state.seq.length);
    col.children[1].classList.toggle('on', !!step.on);
    col.children[2].classList.toggle('on', !!step.accent);
    col.children[3].classList.toggle('on', !!step.slide);
  }

  function syncSteps() {
    for (let i = 0; i < 16; i++) syncStep(i);
    markPlayhead(playhead);
  }

  function syncGates() {
    [...gateSlots.children].forEach((button, i) => button.classList.toggle('on', state.seq.gates[i] !== false));
  }

  function markPlayhead(index) {
    [...stepGrid.children].forEach((col, i) => col.classList.toggle('now', i === index));
  }

  const sequencer = {
    playing: false,
    timer: 0,
    step: 0,
    next: 0,
    toggle() {
      if (this.playing) this.stop();
      else this.start();
    },
    start() {
      onGesture(() => {
        this.playing = true;
        this.step = 0;
        this.next = engine.ctx.currentTime + 0.06;
        clearInterval(this.timer);
        this.timer = setInterval(() => this.pump(), 20);
        playBtn.classList.add('on');
        playBtn.textContent = 'PLAY';
      });
    },
    stop() {
      this.playing = false;
      playhead = -1;
      clearInterval(this.timer);
      if (engine.ready) {
        engine.noteOff('seq-A');
        engine.noteOff('seq-B');
        engine.setGate(1);
      }
      if (playBtn) {
        playBtn.classList.remove('on');
        markPlayhead(-1);
      }
    },
    pump() {
      if (!this.playing || !engine.ctx) return;
      const seq = state.seq;
      const beat = 60 / seq.bpm;
      const base = beat * Number(seq.division || 0.25);
      const swing = clamp(seq.swing || 0, 0, 0.55);
      let guard = 0;
      while (this.next < engine.ctx.currentTime + 0.12 && guard++ < 8) {
        const interval = this.step % 2 === 0 ? base * (1 + swing) : base * (1 - swing);
        this.fire(this.step, this.next, Math.max(0.03, interval));
        this.next += Math.max(0.03, interval);
        this.step = (this.step + 1) % seq.length;
      }
    },
    fire(index, time, interval) {
      playhead = index;
      markPlayhead(index);
      const seq = state.seq;
      if (seq.gateOn) {
        const open = seq.gates[index] !== false;
        engine.setGate(open ? 1 : 1 - (seq.gateDepth || 0), time);
      } else engine.setGate(1, time);
      const step = seq.steps[index];
      const targets = seq.target === 'both' ? ['A', 'B'] : [seq.target];
      if (!step || !step.on) {
        engine.noteOff('seq-A', time);
        engine.noteOff('seq-B', time);
        return;
      }
      const next = seq.steps[(index + 1) % seq.length];
      const slide = !!(step.slide && next && next.on);
      const vel = clamp((step.vel || 100) + (step.accent ? 24 : 0), 1, 127);
      const glide = slide ? Math.max(0.05, state.glide || 0.08) : 0;
      ['A', 'B'].forEach((id) => {
        const voiceId = 'seq-' + id;
        if (!targets.includes(id) || !state.layers[id].enabled) {
          engine.noteOff(voiceId, time);
          return;
        }
        engine.noteOn(voiceId, step.note, vel, { layer: id, time, glide, legato: slide });
        if (!slide) engine.noteOff(voiceId, time + interval * 0.9);
      });
    }
  };

  function buildBed() {
    const main = el('div', 'bed-main');
    const oct = el('div', 'oct');
    const up = el('button', '', '▲');

  function wireWheel(node, kind) {
    let drag = null;
    node.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      onGesture();
      node.setPointerCapture(event.pointerId);
      drag = event.clientY;
      move(event);
    });
    node.addEventListener('pointermove', move);
    node.addEventListener('pointerup', release);
    node.addEventListener('pointercancel', release);
    function move(event) {
      if (!node.hasPointerCapture(event.pointerId)) return;
      const rect = node.getBoundingClientRect();
      const ratio = 1 - clamp((event.clientY - rect.top) / rect.height, 0, 1);
      if (kind === 'pitch') setPitch(ratio * 2 - 1);
      else setMod(ratio);
      drag = event.clientY;
    }
    function release(event) {
      if (kind !== 'pitch') return;
      const spring = () => {
        pitchValue *= 0.72;
        if (Math.abs(pitchValue) < 0.01) pitchValue = 0;
        if (engine.ready) engine.bend(pitchValue);
        placeWheels();
        if (pitchValue !== 0) requestAnimationFrame(spring);
      };
      requestAnimationFrame(spring);
    }
  }

  function placeWheels() {
    if (!pitchCap) return;
    pitchCap.style.top = (8 + (1 - (pitchValue + 1) / 2) * 68) + '%';
    modCap.style.top = (8 + (1 - modValue) * 68) + '%';
  }

  function setPitch(value) {
    pitchValue = clamp(value, -1, 1);
    placeWheels();
    if (engine.ready) engine.bend(pitchValue);
  }

  function setMod(value) {
    modValue = clamp(value, 0, 1);
    placeWheels();
    if (engine.ready) engine.mod(modValue);
  }

  function buildKeys() {
    const host = plugin.querySelector('#keys');
    host.replaceChildren();
    const base = 12 * (octave + 1);
    const whites = [];
    for (let midi = base; midi <= base + 24; midi++) {
      if ([0, 2, 4, 5, 7, 9, 11].includes(midi % 12)) whites.push(midi);
    }
    const whiteW = 100 / whites.length;
    whites.forEach((midi, index) => {
      const key = el('button', 'white');
      key.type = 'button';
      key.tabIndex = -1;
      key.dataset.note = String(midi);
      key.style.left = (index * whiteW) + '%';
      key.style.width = (whiteW - 0.35) + '%';
      if (midi % 12 === 0) key.append(el('span', 'key-label', noteName(midi)));
      host.append(key);
    });
    const blackOffset = { 1: 0.64, 3: 1.7, 6: 3.64, 8: 4.72, 10: 5.76 };
    for (let midi = base; midi < base + 24; midi++) {
      const semi = midi % 12;
      if (blackOffset[semi] == null) continue;
      const octaveIndex = Math.floor((midi - base) / 12);
      const key = el('button', 'black');
      key.type = 'button';
      key.tabIndex = -1;
      key.dataset.note = String(midi);
      key.style.left = ((octaveIndex * 7 + blackOffset[semi]) * whiteW - whiteW * 0.3) + '%';
      key.style.width = (whiteW * 0.6) + '%';
      host.append(key);
    }
    host.onpointerdown = (event) => {
      if (event.button !== 0) return;
      host.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, null);
      const start = () => glideTo(event);
      if (!engine.ready) onGesture(start);
      else start();
    };
    host.onpointermove = glideTo;
    host.onpointerup = endPointer;
    host.onpointercancel = endPointer;
    plugin.querySelector('#octLabel').textContent = 'C' + octave;
    for (const midi of down.keys()) paintKey(midi, true);
  }

  function glideTo(event) {
    if (!pointers.has(event.pointerId)) return;
    const hit = document.elementFromPoint(event.clientX, event.clientY);
    const key = hit && hit.closest ? hit.closest('[data-note]') : null;
    const note = key ? Number(key.dataset.note) : null;
    const prev = pointers.get(event.pointerId);
    if (prev === note) return;
    if (prev != null) endNote(prev);
    if (note != null) beginNote(note, 108);
    pointers.set(event.pointerId, note);
  }

  function endPointer(event) {
    const prev = pointers.get(event.pointerId);
    if (prev != null) endNote(prev);
    pointers.delete(event.pointerId);
  }

  function setOctave(value) {
    octave = clamp(value, 1, 7);
    buildKeys();
  }

  function beginNote(midi, vel) {
    const existing = down.get(midi);
    if (existing) {
      existing.count++;
      paintKey(midi, true);
      return;
    }
    let legato = false;
    while (order.length >= state.polyphony) {
      legato = state.polyphony === 1 && state.glide > 0;
      const old = order.shift();
      down.delete(old);
      sendOff(old);
      paintKey(old, false);
    }
    down.set(midi, { count: 1 });
    order.push(midi);
    sendOn(midi, vel, legato ? state.glide : 0, legato);
    paintKey(midi, true);
  }

  function endNote(midi) {
    const existing = down.get(midi);
    if (!existing) return;
    existing.count--;
    if (existing.count > 0) return;
    down.delete(midi);
    const at = order.indexOf(midi);
    if (at >= 0) order.splice(at, 1);
    sendOff(midi);
    paintKey(midi, false);
  }

  function sendOn(midi, vel, glide, legato) {
    if (!engine.ready) return;
    ['A', 'B'].forEach((id) => {
      if (!state.layers[id].enabled) return;
      engine.noteOn('key-' + midi + id, midi, vel, { layer: id, glide, legato });
    });
  }

  function sendOff(midi) {
    if (!engine.ready) return;
    engine.noteOff('key-' + midi + 'A');
    engine.noteOff('key-' + midi + 'B');
  }

  function releaseLayer(id) {
    for (const midi of down.keys()) engine.noteOff('key-' + midi + id);
    engine.noteOff('seq-' + id);
  }

  function paintKey(midi, on) {
    const key = plugin.querySelector('[data-note="' + midi + '"]');
    if (key) key.classList.toggle('on', on);
  }

    const id = 'user:' + Date.now();
    state.name = name;
    user.push({ id, name, state: clone(state) });

    menu.replaceChildren();
    menu.append(el('div', 'group', 'FACTORY'));
    FACTORY.forEach((preset) => menu.append(menuItem('factory:' + preset.name, preset.name, false)));
    menu.append(el('div', 'group', 'USER'));

  function menuItem(id, name, removable) {
    const button = el('button', id === currentId ? 'on' : '');
    button.type = 'button';
    const label = el('span', '', name);
    button.append(label);
    if (removable) {
      const kill = el('span', 'kill', '✕');
      kill.addEventListener('click', (event) => {
        event.stopPropagation();
        const at = user.findIndex((preset) => preset.id === id);
        if (at >= 0) user.splice(at, 1);
        saveUserPresets(user);
        if (currentId === id) loadPreset('factory:Init');
        fillMenu();
      });
      button.append(kill);
    } else button.append(el('span', 'tag', 'FACTORY'));
    button.addEventListener('click', () => {
      loadPreset(id);
      menu.hidden = true;
    });

  function catalog() {
    return [
      ...FACTORY.map((preset) => ({ id: 'factory:' + preset.name, name: preset.name })),
      ...user.map((preset) => ({ id: preset.id, name: preset.name }))
    ];
  }

  function stepPreset(dir) {
    const list = catalog();
    let index = list.findIndex((preset) => preset.id === currentId);
    if (index < 0) index = 0;
    index = (index + dir + list.length) % list.length;
    loadPreset(list[index].id);
  }

  function loadPreset(id) {
    state = recall(id, user);
    currentId = id;
    saveLastId(id);
    schedule();
    paintAll();
  }

  function exportPreset() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const link = el('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'continuum-mosaic-' + (state.name || 'preset').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
    document.body.append(link);
    link.click();
    setTimeout(() => {
      URL.revokeObjectURL(link.href);
      link.remove();
    }, 1500);
    menu.hidden = true;
  }

  function importFile(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    file.text().then((text) => {
      const data = JSON.parse(text);
      if (Array.isArray(data)) {
        data.forEach((preset, index) => {
          if (!preset || typeof preset !== 'object') return;
          const name = preset.name || 'Imported ' + (index + 1);
          const body = preset.state && preset.state.layers ? preset.state : preset;
          user.push({ id: 'user:' + Date.now() + '-' + index, name, state: normalize(body) });
        });
        saveUserPresets(user);
        statusNode.textContent = 'Imported ' + data.length;
        return;
      }
      const body = data.state && data.state.layers ? data.state : data;
      if (!body.layers) throw new Error('Not a Continuum preset');
      state = normalize(body);
      state.name = data.name || body.name || 'Imported';
      const id = 'user:' + Date.now();
      user.push({ id, name: state.name, state: clone(state) });
      saveUserPresets(user);
      currentId = id;
      saveLastId(id);
      schedule();
      paintAll();
      statusNode.textContent = 'Imported';
    }).catch((err) => {
      statusNode.textContent = err.message || 'Import failed';
    });
  }

  function pathOf(path) {
    return path.replace('$.', editLayer + '.');
  }

  function getPath(path) {
    return pathOf(path).split('.').reduce((node, key) => node[key], state);
  }

  function setPath(path, value) {
    const parts = pathOf(path).split('.');
    let node = state;
    for (let i = 0; i < parts.length - 1; i++) node = node[parts[i]];
    const numeric = typeof node[parts[parts.length - 1]] === 'number';
    node[parts[parts.length - 1]] = numeric && typeof value === 'string' ? Number(value) : value;
  }

  function schedule() {
    saveLastState(state);
    if (pushFrame) return;
    pushFrame = requestAnimationFrame(() => {
      pushFrame = 0;
      engine.setState(state);
    });
  }

  function addKnob(parent, spec) {
    const node = el('div', 'knob');
    node.tabIndex = 0;
    node.innerHTML = `
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle class="track" cx="24" cy="24" r="16"></circle>
        <circle class="arc" cx="24" cy="24" r="16"></circle>
        <circle class="cap" cx="24" cy="24" r="10.5"></circle>
        <line class="needle" x1="24" y1="24" x2="24" y2="9"></line>
      </svg>
      <div class="kv"></div><div class="kl"></div>`;
    parent.append(node);
    const arc = node.querySelector('.arc');
    const track = node.querySelector('.track');
    const needle = node.querySelector('.needle');
    const value = node.querySelector('.kv');
    node.querySelector('.kl').textContent = spec.label;
    const sweep = 2 * Math.PI * 16 * 0.75;
    const gap = 2 * Math.PI * 16;
    track.style.strokeDasharray = sweep + ' ' + gap;
    track.setAttribute('transform', 'rotate(135 24 24)');
    arc.style.strokeDasharray = sweep + ' ' + gap;
    arc.setAttribute('transform', 'rotate(135 24 24)');
    const norm = (v) => {
      if (spec.log) return (Math.log(v) - Math.log(spec.min)) / (Math.log(spec.max) - Math.log(spec.min));
      return (v - spec.min) / (spec.max - spec.min);
    };
    const from = (n) => {
      const t = clamp(n, 0, 1);
      let next = spec.log ? Math.exp(Math.log(spec.min) + t * (Math.log(spec.max) - Math.log(spec.min))) : spec.min + t * (spec.max - spec.min);
      if (spec.step) next = Math.round(next / spec.step) * spec.step;
      return clamp(next, spec.min, spec.max);
    };
    const paint = () => {
      const raw = Number(getPath(spec.path));
      const current = Number.isFinite(raw) ? raw : spec.def;
      const n = clamp(norm(current), 0, 1);
      arc.style.strokeDashoffset = String(sweep * (1 - n));
      needle.setAttribute('transform', 'rotate(' + (-135 + n * 270) + ' 24 24)');
      value.textContent = spec.format ? spec.format(current) : String(current);
      node.setAttribute('aria-valuenow', String(current));
      node.setAttribute('aria-label', spec.label);
    };
    let drag = null;
    node.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      node.setPointerCapture(event.pointerId);
      drag = { y: event.clientY, n: norm(Number(getPath(spec.path))) };
    });
    node.addEventListener('pointermove', (event) => {
      if (!drag) return;
      const span = event.shiftKey ? 860 : 150;
      apply(from(drag.n + (drag.y - event.clientY) / span));
    });
    const end = () => { drag = null; };
    node.addEventListener('pointerup', end);
    node.addEventListener('pointercancel', end);
    node.addEventListener('wheel', (event) => {
      event.preventDefault();
      const dir = event.deltaY > 0 ? -1 : 1;
      apply(from(norm(Number(getPath(spec.path))) + dir * (event.shiftKey ? 0.004 : 0.02)));
    }, { passive: false });
    node.addEventListener('dblclick', () => apply(spec.def));
    node.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
      event.preventDefault();
      event.stopPropagation();
      const dir = event.key === 'ArrowUp' ? 1 : -1;
      apply(from(norm(Number(getPath(spec.path))) + dir * (event.shiftKey ? 0.005 : 0.025)));
    });
    function apply(next) {
      setPath(spec.path, next);
      schedule();
      widgets.forEach((widget) => { if (widget.path === spec.path) widget.paint(); });
      if (spec.path.startsWith('seq.')) syncSteps();
    }
    widgets.push({ path: spec.path, paint });
    paint();
    return node;
  }

  function addSegments(parent, spec) {
    const row = el('div', 'segs');
    spec.options.forEach(([value, label]) => {
      const button = el('button', '', label);
      button.type = 'button';
      button.addEventListener('click', () => {
        setPath(spec.path, value);
        schedule();
        paintAll();
      });
      row.append(button);
    });
    parent.append(row);
    widgets.push({
      path: spec.path,
      paint() {
        const current = getPath(spec.path);
        [...row.children].forEach((button, index) => button.classList.toggle('on', spec.options[index][0] === current));
      }
    });
  }

  function addSwitch(parent, spec) {
    const button = el('button', 'switch', spec.label);
    button.type = 'button';
    button.addEventListener('click', () => {
      const next = !getPath(spec.path);
      setPath(spec.path, next);
      if (spec.onToggle) spec.onToggle(next);
      schedule();
      paintAll();
    });
    parent.append(button);
    widgets.push({
      path: spec.path,
      paint() {
        const on = !!getPath(spec.path);
        button.classList.toggle('on', on);
        if (spec.liveLabel) button.textContent = on ? 'ON' : 'OFF';
      }
    });
  }

  function addSelect(parent, spec) {
    const select = el('select', 'slim');
    spec.options.forEach(([value, label]) => {
      const option = el('option', '', label);
      option.value = value;
      select.append(option);
    });
    select.addEventListener('change', () => {
      setPath(spec.path, spec.numeric ? Number(select.value) : select.value);
      schedule();
      if (String(spec.path).startsWith('seq.')) syncSteps();
    });
    parent.append(select);
    widgets.push({
      path: spec.path,
      paint() {
        const current = getPath(spec.path);
        const asText = spec.numeric ? matchNumeric(spec.options, current) : String(current);
        select.value = asText;
      }
    });
  }

  function matchNumeric(options, value) {
    let best = options[0][0];
    let score = Infinity;
    options.forEach(([option]) => {
      const delta = Math.abs(Number(option) - Number(value));
      if (delta < score) {
        score = delta;
        best = option;
      }
    });
    return best;
  }

  function paintAll() {
    widgets.forEach((widget) => widget.paint());
    nameBtn.textContent = state.name || 'Init';
    plugin.classList.toggle('layer-b', editLayer === 'B');
    const chip = plugin.querySelector('#layerChip');
    if (chip) chip.textContent = 'EDITING ' + editLayer;
    [...tabs.querySelectorAll('[data-edit]')].forEach((button) => button.classList.toggle('on', button.dataset.edit === editLayer));
    if (stepGrid) {
      syncSteps();
      syncGates();
    }
  }

  function onGesture(after) {
    const pending = engine.ensure(state).then(() => {
      if (!engine.ctx || engine.ctx.state === 'suspended') {
        overlay.hidden = false;
        statusNode.textContent = 'Click START to enable audio';
        const box = plugin.querySelector('#bootError');
        if (box) box.textContent = 'The browser blocked audio. Click START.';
        return;
      }
      overlay.hidden = true;
      statusNode.textContent = 'Audio on';
      if (!midiLive) {
        midiLive = true;
        bindMidi({
          status(text) {
            midiDot.title = text || '';
            const connected = !!text && text !== 'No MIDI' && text !== 'MIDI blocked';
            midiDot.classList.toggle('live', connected);
          },
          message: onMidi
        });
      }
      engine.setState(state);
      if (after) after();
    }).catch((err) => {
      const box = plugin.querySelector('#bootError');
      if (box) box.textContent = err && err.message ? err.message : 'Audio failed to start';
      overlay.hidden = false;
      statusNode.textContent = 'Audio error';
    });
    return pending;
  }

  function onMidi(data) {
    const status = data[0] & 0xf0;
    const d1 = data[1];
    const d2 = data[2] || 0;
    if (status === 0x90 && d2 > 0) beginNote(d1, d2);
    else if (status === 0x80 || (status === 0x90 && d2 === 0)) endNote(d1);
    else if (status === 0xe0) setPitch((((d2 << 7) | d1) - 8192) / 8192);
    else if (status === 0xb0 && d1 === 1) setMod(d2 / 127);
    else if (status === 0xb0 && d1 === 64) engine.sustain(d2 >= 64);
  }

  window.addEventListener('keydown', (event) => {
    if (isTyping(event)) return;
    if (event.code === 'Space') {
      const tag = event.target && event.target.tagName;
      if (tag === 'BUTTON' || (event.target.closest && event.target.closest('.knob'))) return;
      event.preventDefault();
      sequencer.toggle();
      return;
    }
    if (event.code === 'Escape') {
      engine.panic();
      down.clear();
      order.length = 0;
      heldKeys.clear();
      plugin.querySelectorAll('.white.on, .black.on').forEach((key) => key.classList.remove('on'));
      return;
    }
    if (event.code === 'KeyZ' && !event.repeat) { setOctave(octave - 1); return; }
    if (event.code === 'KeyX' && !event.repeat) { setOctave(octave + 1); return; }
    const index = KEYS.indexOf(event.code);
    if (index < 0 || event.repeat || heldKeys.has(event.code)) return;
    event.preventDefault();
    const midi = 12 * (octave + 1) + index;
    heldKeys.set(event.code, midi);
    const play = () => {
      if (heldKeys.get(event.code) !== midi) return;
      beginNote(midi, 104);
    };
    if (!engine.ready) onGesture(play);
    else play();
  });

  window.addEventListener('keyup', (event) => {
    const midi = heldKeys.get(event.code);
    if (midi == null) return;
    heldKeys.delete(event.code);
    endNote(midi);
  });

  engine.onMeter = (meter) => {
    voiceNode.textContent = String(meter.voices);
    cpuNode.firstChild.style.width = Math.round(clamp(meter.cpu, 0, 1) * 100) + '%';
    scope = meter.scope;
  };

  function frame(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    oscVis += dt * 0.45;
    lfoVis[0] += dt * (state.lfo[0].rate || 0);
    lfoVis[1] += dt * (state.lfo[1].rate || 0);
    if (page === 'play') {
      plugin.querySelectorAll('canvas.display[data-osc]').forEach((canvas) => {
        const index = Number(canvas.dataset.osc);
        const osc = state.layers[editLayer].osc[index];
        if (osc) drawWave(canvas, osc, oscVis);
      });
      const filter = plugin.querySelector('canvas.filter');
      if (filter) drawFilter(filter, state.layers[editLayer].filter);
      plugin.querySelectorAll('canvas.env').forEach((canvas) => drawEnv(canvas, state.layers[editLayer][canvas.dataset.env]));
      plugin.querySelectorAll('canvas.lfo').forEach((canvas) => {
        const index = Number(canvas.dataset.lfo);
        drawLfo(canvas, state.lfo[index].wave, lfoVis[index]);
      });
    }
    if (scopeCanvas && scope) drawScope(scopeCanvas, scope);
    requestAnimationFrame(frame);
  }

  function prep(canvas) {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (width < 2 || height < 2) return null;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const bw = Math.floor(width * dpr);
    const bh = Math.floor(height * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { g, width, height };
  }

  function accent() {
    return getComputedStyle(plugin).getPropertyValue('--accent').trim() || '#e2a84a';
  }

  function drawWave(canvas, osc, phase) {
    const view = prep(canvas);
    if (!view || !osc) return;
    const { g, width, height } = view;
    g.clearRect(0, 0, width, height);
    g.strokeStyle = accent();
    g.lineWidth = 1.4;
    g.beginPath();
    for (let x = 0; x <= width; x++) {
      const t = (x / width * 2 + phase) % 1;
      let y;
      if (osc.wave === 'square') y = t < (osc.pwm || 0.5) ? 1 : -1;
      else if (osc.wave === 'triangle') y = t < 0.5 ? t * 4 - 1 : 3 - t * 4;
      else if (osc.wave === 'sine') y = Math.sin(t * Math.PI * 2);
      else y = 2 * ((t + 0.5) % 1) - 1;
      const py = height / 2 - y * height * 0.36;
      if (x === 0) g.moveTo(x, py);
      else g.lineTo(x, py);
    }
    g.stroke();
  }

  function drawFilter(canvas, filter) {
    const view = prep(canvas);
    if (!view) return;
    const { g, width, height } = view;
    g.clearRect(0, 0, width, height);
    g.strokeStyle = '#243044';
    g.beginPath();
    g.moveTo(0, height / 2);
    g.lineTo(width, height / 2);
    g.stroke();
    const q = 0.7 + filter.res * filter.res * 16;
    g.strokeStyle = accent();
    g.lineWidth = 1.5;
    g.beginPath();
    for (let x = 0; x <= width; x++) {
      const f = 30 * Math.pow(14000 / 30, x / width);
      const mag = filterMag(filter.type, f, filter.cutoff, q, filter.comb || 0);
      const db = 20 * Math.log10(Math.max(mag, 0.001));
      const y = height * 0.55 - db / 36 * height * 0.45;
      if (x === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.stroke();
  }

  function drawEnv(canvas, env) {
    const view = prep(canvas);
    if (!view) return;
    const { g, width, height } = view;
    g.clearRect(0, 0, width, height);
    const hold = 0.45;
    const total = env.a + env.d + hold + env.r;
    const xAt = (time) => (time / total) * (width - 8) + 4;
    const yAt = (level) => height - 6 - level * (height - 14);
    g.beginPath();
    g.moveTo(4, yAt(0));
    g.lineTo(xAt(env.a), yAt(1));
    g.lineTo(xAt(env.a + env.d), yAt(env.s));
    g.lineTo(xAt(env.a + env.d + hold), yAt(env.s));
    g.lineTo(xAt(total), yAt(0));
    g.strokeStyle = accent();
    g.lineWidth = 1.5;
    g.stroke();
  }

  function drawLfo(canvas, wave, phase) {
    const view = prep(canvas);
    if (!view) return;
    const { g, width, height } = view;
    g.clearRect(0, 0, width, height);
    g.strokeStyle = '#6ee0d2';
    g.lineWidth = 1.4;
    g.beginPath();
    const p = phase % 1;
    for (let x = 0; x <= width; x++) {
      const t = (x / width + p) % 1;
      let y = Math.sin(t * Math.PI * 2);
      if (wave === 'square') y = t < 0.5 ? 1 : -1;
      else if (wave === 'saw') y = 2 * t - 1;
      else if (wave === 'triangle') y = t < 0.5 ? t * 4 - 1 : 3 - t * 4;
      else if (wave === 'sample') y = (Math.floor((t + p) * 8) % 2 === 0) ? 0.7 : -0.7;
      const py = height / 2 - y * height * 0.34;
      if (x === 0) g.moveTo(x, py);
      else g.lineTo(x, py);
    }
    g.stroke();
  }

  function drawScope(canvas, data) {
    const view = prep(canvas);
    if (!view) return;
    const { g, width, height } = view;
    g.clearRect(0, 0, width, height);
    g.strokeStyle = '#e2a84a';
    g.lineWidth = 1.2;
    g.beginPath();
    for (let i = 0; i < data.length; i++) {
      const x = (i / (data.length - 1)) * width;
      const y = height / 2 - data[i] * height * 0.45;
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.stroke();
  }
}

function isTyping(event) {
  const target = event.target;
  if (!target || !target.tagName) return false;
  const tag = target.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

function hz(value) {
  if (value >= 1000) return (value / 1000).toFixed(value >= 10000 ? 1 : 2) + 'k';
  return String(Math.round(value));
}

function seconds(value) {
  if (value >= 1) return value.toFixed(2) + 's';
  return Math.round(value * 1000) + 'ms';
}

function signed(value) {
  const text = value.toFixed(2);
  return value > 0 ? '+' + text : text;
}

function filterMag(type, f, cutoff, q, comb) {
  const w = f / Math.max(30, cutoff);
  const r = w * w;
  const denom = Math.sqrt((1 - r) * (1 - r) + Math.pow(w / q, 2)) || 1;
  if (type === 'highpass') return r / denom;
  if (type === 'bandpass') return (w / q) / denom;
  if (type === 'notch') return Math.abs(1 - r) / denom;
  if (type === 'comb') return Math.abs((1 - comb) / (1 - comb * Math.cos(Math.PI * Math.min(w, 8))));
  return 1 / denom;
}

const engine = new Engine();
const stage = document.getElementById('stage');
const bootNote = document.getElementById('bootNote');

try {
  mount(stage, engine);
  if (bootNote) bootNote.remove();
} catch (err) {
  const message = err && err.message ? err.message : String(err);
  if (bootNote) bootNote.textContent = message;
  else stage.textContent = message;
}

window.addEventListener('error', (event) => {
  const node = document.getElementById('bootError');
  if (node) node.textContent = event.message || 'Script error';
});

window.addEventListener('unhandledrejection', (event) => {
  const node = document.getElementById('bootError');
  const reason = event.reason;
  const message = reason && reason.message ? reason.message : String(reason || 'Unhandled error');
  if (node) node.textContent = message;
});

</script>
</body>
</html>
